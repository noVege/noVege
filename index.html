<!DOCTYPE html>
<html>
<head>
    <title>10college</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./css/common.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #playBgmBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Play Music Button -->
    <button id="playBgmBtn">🎵 Play Music</button>
    <audio id="bgm" src="./assets/music/bgm.mp3" loop></audio>

    <!-- External Script -->
    <script src="./libs/fas.js"></script>

    <!-- Main Module Script -->
    <script type="module">
        import { App } from './app.js';

        const bgm = document.getElementById('bgm');
        const btn = document.getElementById('playBgmBtn');
        let isPlaying = false;

        function toggle(playForced = false) {
            if (bgm.paused || playForced) {
                bgm.play();
                btn.textContent = '⏸️ Pause Music';
                isPlaying = true;
            } else {
                bgm.pause();
                btn.textContent = '🎵 Play Music';
                isPlaying = false;
            }
        }

        btn.addEventListener('click', () => toggle());

        document.addEventListener("DOMContentLoaded", () => {
            const app = new App();
            window.app = app;

            const renderer = app.renderer;
            const scene = app.scene;
            const camera = app.camera;

            // 🎮 Trigger music via controller
            const controller = renderer.xr.getController(0);
            controller.addEventListener('selectstart', () => {
                console.log('🎮 Trigger pressed');
                toggle();
            });
            scene.add(controller);

            // 🔍 Auto play when near "oiiai cat"
            let target = null;

            const checkReady = setInterval(() => {
                if (!scene) return;
                scene.traverse(obj => {
                    if (obj.name === "oiiai cat") {
                        target = obj;
                        console.log("🎯 Found oiiai cat");
                        clearInterval(checkReady);
                    }
                });
            }, 500);

            renderer.setAnimationLoop(() => {
                if (target && camera) {
                    const dist = camera.position.distanceTo(target.getWorldPosition(new THREE.Vector3()));
                    if (dist < 3) {
                        if (!isPlaying) toggle(true);
                    } else {
                        if (isPlaying) toggle(false);
                    }
                }
                renderer.render(scene, camera);
            });
        });
    </script>
</body>
</html>
