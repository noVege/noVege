<!DOCTYPE html>
<html>
<head>
    <title>10college</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" sizes="180x180" href="./css/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./css/favicon/favicon2.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./css/favicon/favicon1.png">
    <link rel="manifest" href="./css/favicon/site.webmanifest">
    <link rel="mask-icon" href="./css/favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <!-- end favicon -->
    <link type="text/css" rel="stylesheet" href="./css/common.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #playBgmBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Music Play Button -->
    <button id="playBgmBtn">🎵 Play Music</button>

    <!-- Audio Element -->
    <audio id="bgm" src="./assets/music/bgm.mp3" loop></audio>


    <!-- Existing script -->
    <script src="./libs/fas.js"></script>
    <script type="module">
        import { App } from './app.js';

        document.addEventListener("DOMContentLoaded", function () {
            const app = new App();
            window.app = app;
        });
    </script>

    <!-- Music Control Script -->
    <script>
        const bgm = document.getElementById('bgm');
        const btn = document.getElementById('playBgmBtn');

        function toggle() {
            if (bgm.paused) {
                bgm.play();
                btn.textContent = '⏸️ Pause Music';
            } else {
                bgm.pause();
                btn.textContent = '🎵 Play Music';
            }
        }

        btn.addEventListener('click', toggle);

        //
        document.addEventListener("DOMContentLoaded", function () {
            const app = new App();
            window.app = app;

            //
            const renderer = app.renderer;
            const scene = app.scene;

            const controller = renderer.xr.getController(0); // right controller
            controller.addEventListener('selectstart', () => {
                console.log('🎮 Trigger pressed');
                toggle();
            });
            scene.add(controller);
        });
    </script>

</body>
</html>
