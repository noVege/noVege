<!DOCTYPE html>
<html>
<head>
    <title>10college</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./css/common.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #playBgmBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 🎵 Music Controls -->
    <button id="playBgmBtn">🎵 Play Music</button>
    <audio id="bgm" src="./assets/music/bgm.mp3" loop></audio>
    <audio id="bgmCat" src="./assets/music/cat1.mp3" loop></audio>

    <!-- Library -->
    <script src="./libs/fas.js"></script>

    <!-- Main -->
    <script type="module">
        import { App } from './app.js';
        import * as THREE from './libs/three/three.module.js';

        document.addEventListener("DOMContentLoaded", () => {
            const bgm = document.getElementById('bgm');
            const bgmCat = document.getElementById('bgmCat');
            const btn = document.getElementById('playBgmBtn');

            const app = new App({ bgm, bgmCat, bgmBtn: btn });
            window.app = app;

            btn.addEventListener('click', () => {
                if (bgm.paused) {
                    bgm.play();
                    bgmCat.play(); // 解锁权限
                    bgmCat.pause();
                    btn.textContent = '⏸️ Pause Music';
                } else {
                    bgm.pause();
                    bgmCat.pause();
                    btn.textContent = '🎵 Play Music';
                }
            });
        });
    </script>
</body>
</html>
