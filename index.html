<!DOCTYPE html>
<html>
<head>
    <title>10college</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" sizes="180x180" href="./css/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./css/favicon/favicon2.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./css/favicon/favicon1.png">
    <link rel="manifest" href="./css/favicon/site.webmanifest">
    <link rel="mask-icon" href="./css/favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link type="text/css" rel="stylesheet" href="./css/common.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #playBgmBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }

        #popupName {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 12px;
            z-index: 10000;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Music Play Button -->
    <button id="playBgmBtn">🎵 Play Music</button>

    <!-- Audio Element -->
    <audio id="bgm" src="./assets/music/bgm.mp3" loop></audio>

    <!-- Popup Name -->
    <div id="popupName">Tung Tung Tung Sahur</div>

    <!-- Existing script -->
    <script src="./libs/fas.js"></script>
    <script type="module">
        import { App } from './app.js';

        document.addEventListener("DOMContentLoaded", function () {
            const app = new App();
            window.app = app;

            // 示例触发弹窗
            setTimeout(() => {
                showPopupName("Tung Tung Tung Sahur");
            }, 2000); // 2秒后自动弹出一次测试用
        });

        function showPopupName(name) {
            const popup = document.getElementById('popupName');
            popup.textContent = name;
            popup.style.display = 'block';
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000); // 2秒后自动隐藏
        }

        // 如果你要在其他地方触发这个函数，可以直接调用 showPopupName('你要显示的名字')
    </script>

    <!-- Music Control Script -->
    <script>
        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('playBgmBtn');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgm.play();
                playBtn.textContent = '⏸️ Pause Music';
                isPlaying = true;
            } else {
                bgm.pause();
                playBtn.textContent = '🎵 Play Music';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
